behaviors:
  Mage:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    time_horizon: 128
    max_steps: 3.0e7
    summary_freq: 30000
    checkpoint_interval: 500000
    keep_checkpoints: 10

environment_parameters:
  # ML-Agents advances each parameter independently on the same reward. Mix thresholds are
  # above the last zombie_count threshold, so new types arrive once 16 zombies are handled.
  # All thresholds are first estimates; tune them from real runs (see docs/TRAINING.md).
  zombie_count:
    curriculum:
      - name: OneZombie
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 12.0
        value: 1.0
      - name: TwoZombies
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 20.0
        value: 2.0
      - name: FourZombies
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 32.0
        value: 4.0
      - name: EightZombies
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 56.0
        value: 8.0
      - name: SixteenZombies
        value: 16.0
  runner_weight:
    curriculum:
      - name: NoRunners
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 120.0
        value: 0.0
      - name: Runners
        value: 0.5
  brute_weight:
    curriculum:
      - name: NoBrutes
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 136.0
        value: 0.0
      - name: Brutes
        value: 0.35
  spitter_weight:
    curriculum:
      - name: NoSpitters
        completion_criteria:
          measure: reward
          behavior: Mage
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 152.0
        value: 0.0
      - name: Spitters
        value: 0.35
  arena_size: 28.0
  hp_mult: 1.0
  damage_mult: 1.0
  speed_mult: 1.0
