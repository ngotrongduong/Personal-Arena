# PPO + curriculum for the Warrior class (mlagents 1.1.0 schema).
# Structure follows ml-agents config/ppo/WallJump_curriculum.yaml.
# Parameter names must match what HeroAgent reads from Academy EnvironmentParameters
# (see .claude/skills/mlagents-training/SKILL.md). Values marked TUNE are first guesses:
# adjust after the first real run and log it in docs/TRAINING.md.

behaviors:
  Warrior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005            # entropy bonus; raise if Policy/Entropy collapses early
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true        # vector obs (health, energy, cooldowns) have different scales
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 30000000
    time_horizon: 128
    summary_freq: 50000

environment_parameters:
  # Curriculum 1 -> 2 -> 4 -> 8 -> 16 zombies, as in the Pezzza video.
  # Thresholds are mean episode reward with RewardConfig defaults (Kill = +1, zombies respawn,
  # 120 s episodes). TUNE after the first run.
  zombie_count:         # -> ArenaConfig.ZombieCount
    curriculum:
      - name: Z1
        completion_criteria: { measure: reward, behavior: Warrior, signal_smoothing: true, min_lesson_length: 200, threshold: 3.0 }
        value: 1
      - name: Z2
        completion_criteria: { measure: reward, behavior: Warrior, signal_smoothing: true, min_lesson_length: 200, threshold: 4.0 }
        value: 2
      - name: Z4
        completion_criteria: { measure: reward, behavior: Warrior, signal_smoothing: true, min_lesson_length: 200, threshold: 5.0 }
        value: 4
      - name: Z8
        completion_criteria: { measure: reward, behavior: Warrior, signal_smoothing: true, min_lesson_length: 300, threshold: 6.0 }
        value: 8
      - name: Z16
        value: 16

  # Domain randomisation so any arena the player picks is familiar (docs/PLAN.md).
  arena_size:           # metres, square side -> ArenaConfig.Width/Height
    sampler_type: uniform
    sampler_parameters: { min_value: 15.0, max_value: 35.0 }
  hp_mult:              # -> ArenaConfig.HpMultiplier
    sampler_type: uniform
    sampler_parameters: { min_value: 0.75, max_value: 1.25 }
  damage_mult:          # -> ArenaConfig.DamageMultiplier
    sampler_type: uniform
    sampler_parameters: { min_value: 0.75, max_value: 1.25 }
  speed_mult:           # -> ArenaConfig.SpeedMultiplier
    sampler_type: uniform
    sampler_parameters: { min_value: 0.9, max_value: 1.1 }
  # Kind mix: Walker-only until M3 adds Runner/Brute/Spitter; then turn these into samplers.
  kind_mix_runner: 0.0
  kind_mix_brute: 0.0
  kind_mix_spitter: 0.0
