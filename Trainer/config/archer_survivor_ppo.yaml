behaviors:
  Archer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 256
    max_steps: 1.0e8
    summary_freq: 50000
    checkpoint_interval: 1000000
    keep_checkpoints: 10

# M7 (T-031): same PPO, network and curricula as warrior_survivor_ppo.yaml, keyed by the Archer
# behavior. Keep the two files in step (test_curricula.py checks they only differ by name).
environment_parameters:
  # TimeUp +5, survival +0.01/s, roughly +0.05/level, and -1 per MaxHp lost put a
  # successful 180 s run near 5 + 1.8 + 0.4 - HP lost = 6.5, while Death -5 puts a
  # failed run near -3. Threshold 5.0 therefore needs most runs to survive; the same
  # reasoning gives roughly 9/12 reward at 360/600 s and thresholds 6.5/8.5.
  run_seconds:
    curriculum:
      - name: survive-3
        completion_criteria:
          measure: reward
          behavior: Archer
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 5.0
        value: 180.0
      - name: survive-6
        completion_criteria:
          measure: reward
          behavior: Archer
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 6.5
        value: 360.0
      - name: survive-10
        completion_criteria:
          measure: reward
          behavior: Archer
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 8.5
        value: 600.0
      - name: full-run
        value: 900.0
  # Build and tier unlock by progress, not reward: harder episodes must not stall
  # run_seconds lessons, while tier-1 blank-build champion evaluation remains the gate.
  tier_min: 1.0
  tier_max:
    curriculum:
      - name: tier-1
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.45
        value: 1.0
      - name: tier-3
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.60
        value: 3.0
      - name: tier-6
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.75
        value: 6.0
      - name: tier-10
        value: 10.0
  build_level_max:
    curriculum:
      - name: blank
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.22
        value: 0.0
      - name: light
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.30
        value: 10.0
      - name: medium
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.40
        value: 25.0
      - name: full
        value: 50.0
  own_build_share: 0.0
  review_share: 0.2
  # Hard episodes (tier +1, opening ring) join the same reward buffer that gates run_seconds,
  # so they stay off until random builds are already in play.
  hard_share:
    curriculum:
      - name: hard-off
        completion_criteria:
          measure: progress
          behavior: Archer
          min_lesson_length: 200
          threshold: 0.30
        value: 0.0
      - name: hard-on
        value: 0.1
