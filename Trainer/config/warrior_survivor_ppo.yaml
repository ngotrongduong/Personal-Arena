behaviors:
  Warrior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    time_horizon: 256
    max_steps: 1.0e8
    summary_freq: 50000
    checkpoint_interval: 1000000
    keep_checkpoints: 10

environment_parameters:
  # TimeUp +5, survival +0.01/s, roughly +0.05/level, and -1 per MaxHp lost put a
  # successful 180 s run near 5 + 1.8 + 0.4 - HP lost = 6.5, while Death -5 puts a
  # failed run near -3. Threshold 5.0 therefore needs most runs to survive; the same
  # reasoning gives roughly 9/12 reward at 360/600 s and thresholds 6.5/8.5.
  run_seconds:
    curriculum:
      - name: survive-3
        completion_criteria:
          measure: reward
          behavior: Warrior
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 5.0
        value: 180.0
      - name: survive-6
        completion_criteria:
          measure: reward
          behavior: Warrior
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 6.5
        value: 360.0
      - name: survive-10
        completion_criteria:
          measure: reward
          behavior: Warrior
          signal_smoothing: true
          min_lesson_length: 200
          threshold: 8.5
        value: 600.0
      - name: full-run
        value: 900.0
  tier_min: 1.0
  tier_max: 1.0
  build_level_max: 0.0
  own_build_share: 0.0
