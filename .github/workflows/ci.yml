name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    # Windows too: the bit-exact goldens in SurvivorM5GoldenTests were recorded on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test CoreTests -c Release --logger "console;verbosity=normal"

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core must not reference UnityEngine / System.Numerics / System.Random
        run: |
          if grep -rnE --include='*.cs' '^\s*using (UnityEngine|System\.Numerics)|new (System\.)?Random\(' Unity/Assets/Arena/Core; then
            echo "::error::Core invariant broken (AGENTS.md section 6)"; exit 1
          fi
      - name: No trained models or results committed
        run: |
          if git ls-files | grep -nE '\.(onnx|sentis|demo)$|^results/|/Library/'; then
            echo "::error::Model/result/Library files are tracked"; exit 1
          fi
      - name: Trainer configs parse
        run: python3 -c "import glob,yaml;[yaml.safe_load(open(f)) for f in glob.glob('Trainer/config/*.yaml')]"
      - name: STATUS and BOARD stay short (token budget for every agent session)
        run: |
          s=$(wc -l < docs/STATUS.md); b=$(wc -l < docs/tasks/BOARD.md)
          echo "STATUS.md: $s lines (max 200), BOARD.md: $b lines (max 60)"
          if [ "$s" -gt 200 ] || [ "$b" -gt 60 ]; then
            echo "::error::Move old session logs to docs/archive/SESSIONS.md and done tasks to docs/archive/BOARD-DONE.md"; exit 1
          fi
